# Local run from this directory. Production: speakasap/docker-compose.blue.yml or .green.yml.
services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: speakasap-api-gateway-local
    ports:
      - "${API_GATEWAY_PORT:-4210}:${API_GATEWAY_PORT:-4210}"
    env_file:
      - ../.env
    environment:
      PORT: ${API_GATEWAY_PORT:-4210}
      SERVICE_NAME: api-gateway
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://127.0.0.1:$${PORT}/health || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 2
    restart: unless-stopped
