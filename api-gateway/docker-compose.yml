# Local run from this directory. Production: speakasap/docker-compose.blue.yml or .green.yml.
services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: speakasap-api-gateway-local
    ports:
      - "${API_GATEWAY_PORT:-4210}:${API_GATEWAY_PORT:-4210}"
    env_file:
      - ../.env
    environment:
      PORT: ${API_GATEWAY_PORT:-4210}
      SERVICE_NAME: api-gateway
      CONTENT_SERVICE_URL: ${CONTENT_SERVICE_URL:-http://content-service:4201}
      CERTIFICATION_SERVICE_URL: ${CERTIFICATION_SERVICE_URL:-http://certification-service:4202}
      ASSESSMENT_SERVICE_URL: ${ASSESSMENT_SERVICE_URL:-http://assessment-service:4203}
      EDUCATION_SERVICE_URL: ${EDUCATION_SERVICE_URL:-http://education-service:4206}
      FINANCIAL_SERVICE_URL: ${FINANCIAL_SERVICE_URL:-http://financial-service:4213}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://127.0.0.1:$${PORT}/health || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 2
    restart: unless-stopped
