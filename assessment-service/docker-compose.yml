# Local / single-container run from this directory.
# Production blue/green: use speakasap/docker-compose.blue.yml or .green.yml at repo root.
services:
  assessment-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: speakasap-assessment-local
    ports:
      - "${PORT:-4203}:${PORT:-4203}"
    env_file:
      - .env
    environment:
      PORT: ${PORT:-4203}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://127.0.0.1:$${PORT}/health || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 2
    restart: unless-stopped
