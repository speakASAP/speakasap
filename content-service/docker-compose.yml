# Local / single-container run from this directory (AGENT13 verification).
# Production blue/green: use speakasap/docker-compose.blue.yml or .green.yml at repo root.
services:
  content-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: speakasap-content-local
    ports:
      - "${PORT:-4201}:${PORT:-4201}"
    env_file:
      - ../.env
    environment:
      PORT: ${PORT:-4201}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://127.0.0.1:$${PORT}/health || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 2
    restart: unless-stopped
