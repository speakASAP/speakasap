services:
  content-service:
    build:
      context: ./content-service
      dockerfile: Dockerfile
    container_name: speakasap-content-blue
    ports:
      - "${CONTENT_SERVICE_PORT}:${CONTENT_SERVICE_PORT}"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DOMAIN=${DOMAIN}
      - SERVICE_NAME=${SERVICE_NAME}
      - PORT=${CONTENT_SERVICE_PORT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DATABASE_URL=${DATABASE_URL}
      - PRISMA_SCHEMA_ENGINE_BINARY=${PRISMA_SCHEMA_ENGINE_BINARY:-}
      - PRISMA_QUERY_ENGINE_BINARY=${PRISMA_QUERY_ENGINE_BINARY:-}
      - REDIS_HOST=${REDIS_HOST:-}
      - REDIS_PORT=${REDIS_PORT:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_TIMESTAMP_FORMAT=${LOG_TIMESTAMP_FORMAT}
      - LOGGING_SERVICE_URL=${LOGGING_SERVICE_URL}
      - LOGGING_SERVICE_API_PATH=${LOGGING_SERVICE_API_PATH}
      - LOGGING_SERVICE_TIMEOUT=${LOGGING_SERVICE_TIMEOUT}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - NOTIFICATION_SERVICE_URL=${NOTIFICATIONS_MICROSERVICE_URL}
      - NOTIFICATION_SERVICE_TIMEOUT=${NOTIFICATION_SERVICE_TIMEOUT}
      - NOTIFICATION_RETRY_MAX_ATTEMPTS=${NOTIFICATION_RETRY_MAX_ATTEMPTS}
      - NOTIFICATION_RETRY_DELAY_MS=${NOTIFICATION_RETRY_DELAY_MS}
      - HTTP_TIMEOUT=${HTTP_TIMEOUT}
      - GATEWAY_TIMEOUT=${GATEWAY_TIMEOUT}
      - AUTH_SERVICE_TIMEOUT=${AUTH_SERVICE_TIMEOUT}
      - RETRY_MAX_ATTEMPTS=${RETRY_MAX_ATTEMPTS}
      - RETRY_DELAY_MS=${RETRY_DELAY_MS}
      - AUTH_RETRY_MAX_ATTEMPTS=${AUTH_RETRY_MAX_ATTEMPTS}
      - AUTH_RETRY_DELAY_MS=${AUTH_RETRY_DELAY_MS}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - FRONTEND_URL=${FRONTEND_URL}
      - AI_SERVICE_URL=${AI_SERVICE_URL}
      - AI_SERVICE_TIMEOUT=${AI_SERVICE_TIMEOUT}
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY}
      - AI_SERVICE_TRANSLATE_PATH=${AI_SERVICE_TRANSLATE_PATH}
      - DEFAULT_PAGE_SIZE=${DEFAULT_PAGE_SIZE}
      - MAX_PAGE_SIZE=${MAX_PAGE_SIZE}
      - ASSETS_BASE_URL=${ASSETS_BASE_URL}
    networks:
      - nginx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${CONTENT_SERVICE_PORT}/health"]
      interval: 10s
      timeout: 10s
      retries: 2

  certification-service:
    build:
      context: ./certification-service
      dockerfile: Dockerfile
    container_name: speakasap-certification-blue
    ports:
      - "${CERTIFICATION_SERVICE_PORT:-4202}:${CERTIFICATION_SERVICE_PORT:-4202}"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DOMAIN=${DOMAIN}
      - SERVICE_NAME=${CERTIFICATION_SERVICE_NAME:-certification-service}
      - PORT=${CERTIFICATION_SERVICE_PORT:-4202}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${CERTIFICATION_DB_NAME:-speakasap_certification_db}
      - DATABASE_URL=${CERTIFICATION_DATABASE_URL:-postgresql://dbadmin@db-server-postgres:5432/speakasap_certification_db}
      - REDIS_HOST=${REDIS_HOST:-}
      - REDIS_PORT=${REDIS_PORT:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_TIMESTAMP_FORMAT=${LOG_TIMESTAMP_FORMAT}
      - LOGGING_SERVICE_URL=${LOGGING_SERVICE_URL}
      - LOGGING_SERVICE_API_PATH=${LOGGING_SERVICE_API_PATH}
      - LOGGING_SERVICE_TIMEOUT=${LOGGING_SERVICE_TIMEOUT}
      - HTTP_TIMEOUT=${HTTP_TIMEOUT}
      - GATEWAY_TIMEOUT=${GATEWAY_TIMEOUT}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - AUTH_SERVICE_TIMEOUT=${AUTH_SERVICE_TIMEOUT}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - FRONTEND_URL=${FRONTEND_URL}
    networks:
      - nginx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${CERTIFICATION_SERVICE_PORT:-4202}/health"]
      interval: 10s
      timeout: 10s
      retries: 2

  assessment-service:
    build:
      context: ./assessment-service
      dockerfile: Dockerfile
    container_name: speakasap-assessment-blue
    ports:
      - "${ASSESSMENT_SERVICE_PORT:-4203}:${ASSESSMENT_SERVICE_PORT:-4203}"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DOMAIN=${DOMAIN}
      - SERVICE_NAME=${ASSESSMENT_SERVICE_NAME:-assessment-service}
      - PORT=${ASSESSMENT_SERVICE_PORT:-4203}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${ASSESSMENT_DB_NAME:-speakasap_assessment_db}
      - DATABASE_URL=${ASSESSMENT_DATABASE_URL:-postgresql://dbadmin@db-server-postgres:5432/speakasap_assessment_db}
      - REDIS_HOST=${REDIS_HOST:-}
      - REDIS_PORT=${REDIS_PORT:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_TIMESTAMP_FORMAT=${LOG_TIMESTAMP_FORMAT}
      - LOGGING_SERVICE_URL=${LOGGING_SERVICE_URL}
      - LOGGING_SERVICE_API_PATH=${LOGGING_SERVICE_API_PATH}
      - LOGGING_SERVICE_TIMEOUT=${LOGGING_SERVICE_TIMEOUT}
      - HTTP_TIMEOUT=${HTTP_TIMEOUT}
      - GATEWAY_TIMEOUT=${GATEWAY_TIMEOUT}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - AUTH_SERVICE_TIMEOUT=${AUTH_SERVICE_TIMEOUT}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - FRONTEND_URL=${FRONTEND_URL}
    networks:
      - nginx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${ASSESSMENT_SERVICE_PORT:-4203}/health"]
      interval: 10s
      timeout: 10s
      retries: 2

networks:
  nginx-network:
    external: true
    name: nginx-network
