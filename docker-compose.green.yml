      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${CERTIFICATION_DB_NAME:-speakasap_certification_db}
      - DATABASE_URL=${CERTIFICATION_DATABASE_URL:-postgresql://dbadmin@db-server-postgres:5432/speakasap_certification_db}
      - REDIS_HOST=${REDIS_HOST:-}
      - REDIS_PORT=${REDIS_PORT:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_TIMESTAMP_FORMAT=${LOG_TIMESTAMP_FORMAT}
      - LOGGING_SERVICE_URL=${LOGGING_SERVICE_URL}
      - LOGGING_SERVICE_API_PATH=${LOGGING_SERVICE_API_PATH}
      - LOGGING_SERVICE_TIMEOUT=${LOGGING_SERVICE_TIMEOUT}
      - HTTP_TIMEOUT=${HTTP_TIMEOUT}
      - GATEWAY_TIMEOUT=${GATEWAY_TIMEOUT}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - AUTH_SERVICE_TIMEOUT=${AUTH_SERVICE_TIMEOUT}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - FRONTEND_URL=${FRONTEND_URL}
    networks:
      - nginx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${CERTIFICATION_SERVICE_PORT:-4202}/health"]
      interval: 10s
      timeout: 10s
