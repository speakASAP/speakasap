# Local / single-container run from this directory.
# Production blue/green: use speakasap/docker-compose.blue.yml or .green.yml at repo root.
services:
  financial-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: speakasap-financial-local
    ports:
      - "${FINANCIAL_SERVICE_PORT:-4213}:${FINANCIAL_SERVICE_PORT:-4213}"
    env_file:
      - ../.env
    environment:
      PORT: ${FINANCIAL_SERVICE_PORT:-4213}
      FINANCIAL_SERVICE_PORT: ${FINANCIAL_SERVICE_PORT:-4213}
      DATABASE_URL: ${FINANCIAL_DATABASE_URL}
      FINANCIAL_DATABASE_URL: ${FINANCIAL_DATABASE_URL}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://127.0.0.1:$${PORT}/health || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 2
    restart: unless-stopped
