apiVersion: v1
kind: ConfigMap
metadata:
  name: speakasap-config
  namespace: statex-apps
  labels:
    app: speakasap
    managed-by: k8s-migration
data:
  NODE_ENV: "production"
  SERVICE_NAME: "speakasap"
  DOMAIN: "speakasap.alfares.cz"
  PORT: "3000"

  # Database
  DB_HOST: "db-server-postgres.statex-apps.svc.cluster.local"
  DB_PORT: "5432"
  DB_USER: "dbadmin"
  DB_NAME: "speakasap_content_db"
  DB_SYNC: "false"
  DB_AUTO_CREATE: "true"

  # Logging service (K8s cluster-internal, port 3367)
  LOGGING_SERVICE_URL: "http://logging-microservice:3367"
  LOGGING_SERVICE_API_PATH: "/api/logs"
  LOGGING_SERVICE_TIMEOUT: "5000"
  LOG_LEVEL: "info"

  # Auth service (K8s cluster-internal, port 3370)
  AUTH_SERVICE_URL: "http://auth-microservice:3370"
  AUTH_SERVICE_TIMEOUT: "5000"
  AUTH_RETRY_MAX_ATTEMPTS: "3"
  AUTH_RETRY_DELAY_MS: "1000"

  # Speakasap internal microservices (K8s cluster-internal)
  CONTENT_SERVICE_URL: "http://speakasap-content:4201"
  CERTIFICATION_SERVICE_URL: "http://speakasap-certification:4202"
  ASSESSMENT_SERVICE_URL: "http://speakasap-assessment:4203"
  COURSE_SERVICE_URL: "http://speakasap-course:4205"
  EDUCATION_SERVICE_URL: "http://speakasap-education:4206"
  USER_SERVICE_URL: "http://speakasap-user:4207"
  PAYMENT_SERVICE_URL: "http://speakasap-payment:4208"
  NOTIFICATION_SERVICE_URL: "http://speakasap-notification:4209"
  SALARY_SERVICE_URL: "http://speakasap-salary:4212"
  FINANCIAL_SERVICE_URL: "http://speakasap-financial:4213"

  # Payments microservice (K8s cluster-internal, port 3468)
  PAYMENTS_MICROSERVICE_URL: "http://payments-microservice:3468"
  PAYMENTS_MICROSERVICE_PORT: "3468"

  # Notifications microservice
  NOTIFICATIONS_MICROSERVICE_PORT: "3368"
  NOTIFICATION_SERVICE_TIMEOUT: "5000"
  NOTIFICATION_RETRY_MAX_ATTEMPTS: "3"
  NOTIFICATION_RETRY_DELAY_MS: "1000"

  # AI service
  AI_SERVICE_URL: "http://ai-microservice:3380"
  AI_MICROSERVICE_PORT: "3380"
  AI_SERVICE_TIMEOUT: "5000"
  AI_SERVICE_TRANSLATE_PATH: "/api/v1/translate"

  # General
  HTTP_TIMEOUT: "30000"
  GATEWAY_TIMEOUT: "60000"
  RETRY_MAX_ATTEMPTS: "3"
  RETRY_DELAY_MS: "1000"
  DEFAULT_PAGE_SIZE: "10"
  MAX_PAGE_SIZE: "30"
  ASSETS_BASE_URL: "https://assets.alfares.cz"
  FRONTEND_URL: "https://speakasap.alfares.cz"
  CORS_ORIGIN: "https://speakasap.alfares.cz"
  NEXT_PUBLIC_API_URL: "https://speakasap.alfares.cz"

  # Payment config
  PAYMENT_APPLICATION_ID: "speakasap"
  PAYMENT_CALLBACK_URL: "https://speakasap.alfares.cz/api/webhooks/payment-result"
  PAYMENT_SUCCESS_URL: "https://speakasap.alfares.cz/payment-result?status=completed"
  PAYMENT_CANCEL_URL: "https://speakasap.alfares.cz/payment-result?status=cancelled"
