apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: speakasap
  namespace: statex-apps
  labels:
    app: speakasap
    managed-by: k8s-migration
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - speakasap.alfares.cz
      secretName: speakasap-tls
  rules:
    - host: speakasap.alfares.cz
      http:
        paths:
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: speakasap-api-gateway
                port:
                  number: 4210
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: speakasap-api-gateway
                port:
                  number: 4210
          - path: /
            pathType: Prefix
            backend:
              service:
                name: speakasap-frontend
                port:
                  number: 4211
