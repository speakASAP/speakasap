---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speakasap-assets
  namespace: statex-apps
  labels:
    app: speakasap-assets
    managed-by: k8s-migration
    migration-scope: seven-public-media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speakasap-assets
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: speakasap-assets
        migration-scope: seven-public-media
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          command:
            - /bin/sh
            - -c
            - |
              cat >/etc/nginx/conf.d/default.conf <<'NGINX'
              server {
                listen 8080;
                server_name _;
                root /usr/share/nginx/html;
                autoindex off;
                server_tokens off;

                location = /health {
                  access_log off;
                  add_header Content-Type text/plain;
                  return 200 "ok\n";
                }

                location /media/ {
                  try_files $uri =404;
                  add_header Cache-Control "public, max-age=14400";
                }

                location / {
                  return 404;
                }
              }
              NGINX
              exec nginx -g 'daemon off;'
          volumeMounts:
            - name: assets-root
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 3
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: assets-root
          hostPath:
            path: /home/ssf/speakasap-assets
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: speakasap-assets
  namespace: statex-apps
  labels:
    app: speakasap-assets
    managed-by: k8s-migration
    migration-scope: seven-public-media
spec:
  type: ClusterIP
  selector:
    app: speakasap-assets
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: speakasap-assets
  namespace: statex-apps
  labels:
    app: speakasap-assets
    managed-by: k8s-migration
    migration-scope: seven-public-media
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - assets.alfares.cz
      secretName: speakasap-assets-tls
  rules:
    - host: assets.alfares.cz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: speakasap-assets
                port:
                  number: 8080
