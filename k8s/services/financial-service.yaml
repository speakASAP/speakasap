---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speakasap-financial
  namespace: statex-apps
  labels:
    app: speakasap-financial
    managed-by: k8s-migration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speakasap-financial
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxSurge 0: this node ran at its 110-pod ceiling mid-deploy on 2026-08-03
      # and eleven surge pods could not schedule ("Too many pods"), so a
      # twelve-service rollout deadlocked until old pods terminated. Rolling in
      # place needs no free slot. Costs brief unavailability per service, which
      # a single-replica deployment on a single node has during any restart
      # anyway.
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: speakasap-financial
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z db-server-postgres 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: app
          image: localhost:5000/speakasap-financial:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4213
              name: http
          envFrom:
            - configMapRef:
                name: speakasap-financial-config
            - secretRef:
                name: speakasap-financial-secret
          startupProbe:
            httpGet:
              path: /health
              port: 4213
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4213
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 4213
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: speakasap-financial
  namespace: statex-apps
  labels:
    app: speakasap-financial
    managed-by: k8s-migration
spec:
  type: ClusterIP
  selector:
    app: speakasap-financial
  ports:
    - protocol: TCP
      port: 4213
      targetPort: 4213
      name: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: speakasap-financial-config
  namespace: statex-apps
  labels:
    app: speakasap-financial
    managed-by: k8s-migration
data:
  NODE_ENV: "production"
  SERVICE_NAME: "speakasap-financial"
  PORT: "4213"
  FINANCIAL_SERVICE_PORT: "4213"
  DB_HOST: "db-server-postgres"
  DB_PORT: "5432"
  DB_USER: "dbadmin"
  DB_NAME: "speakasap_financial_db"
  FINANCIAL_DB_NAME: "speakasap_financial_db"
  DB_SYNC: "false"
  DB_AUTO_CREATE: "true"
  REDIS_HOST: "db-server-redis"
  REDIS_PORT: "6379"
  LOG_LEVEL: "info"
  LOGGING_SERVICE_URL: "http://logging-microservice:3367"
  LOGGING_SERVICE_API_PATH: "/api/logs"
  LOGGING_SERVICE_TIMEOUT: "5000"
  AUTH_SERVICE_URL: "http://auth-microservice:3370"
  AUTH_SERVICE_TIMEOUT: "5000"
  AUTH_RETRY_MAX_ATTEMPTS: "3"
  AUTH_RETRY_DELAY_MS: "1000"
  USER_SERVICE_URL: "http://speakasap-user:4207"
  COURSE_SERVICE_URL: "http://speakasap-course:4205"
  PAYMENT_SERVICE_URL: "http://speakasap-payment:4208"
  SALARY_SERVICE_URL: "http://speakasap-salary:4212"
  COURSE_SERVICE_INTERNAL_TOKEN: "6629c420d6d902079715b004394bae612ca4f0ccb80da7c0"
  PAYMENT_SERVICE_INTERNAL_TOKEN: "6629c420d6d902079715b004394bae612ca4f0ccb80da7c0"
  SALARY_SERVICE_INTERNAL_TOKEN: "6629c420d6d902079715b004394bae612ca4f0ccb80da7c0"
  INTERNAL_API_TOKEN: "6629c420d6d902079715b004394bae612ca4f0ccb80da7c0"
  NOTIFICATION_SERVICE_URL: "http://speakasap-notification:4209"
  NOTIFICATION_SERVICE_TIMEOUT: "5000"
  HTTP_TIMEOUT: "30000"
  GATEWAY_TIMEOUT: "60000"
  RETRY_MAX_ATTEMPTS: "3"
  RETRY_DELAY_MS: "1000"
  DEFAULT_PAGE_SIZE: "10"
  MAX_PAGE_SIZE: "30"
  ASSETS_BASE_URL: "https://assets.alfares.cz"
  FRONTEND_URL: "https://speakasap.alfares.cz"
  CORS_ORIGIN: "https://speakasap.alfares.cz"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: speakasap-financial-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: speakasap-financial-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/speakasap
        property: DB_PASSWORD
    - secretKey: JWT_TOKEN
      remoteRef:
        key: secret/prod/speakasap
        property: JWT_TOKEN
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/prod/speakasap/financial
        property: DATABASE_URL
    - secretKey: FINANCIAL_DATABASE_URL
      remoteRef:
        key: secret/prod/speakasap/financial
        property: FINANCIAL_DATABASE_URL
    - secretKey: FINANCIAL_INTERNAL_API_TOKEN
      remoteRef:
        key: secret/prod/speakasap/financial
        property: FINANCIAL_INTERNAL_API_TOKEN
