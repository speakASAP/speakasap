---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speakasap-frontend
  namespace: statex-apps
  labels:
    app: speakasap-frontend
    managed-by: k8s-migration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speakasap-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxSurge 0: this node ran at its 110-pod ceiling mid-deploy on 2026-08-03
      # and eleven surge pods could not schedule ("Too many pods"), so a
      # twelve-service rollout deadlocked until old pods terminated. Rolling in
      # place needs no free slot. Costs brief unavailability per service, which
      # a single-replica deployment on a single node has during any restart
      # anyway.
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: speakasap-frontend
    spec:
      containers:
        - name: app
          image: localhost:5000/speakasap-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4211
              name: http
          envFrom:
            - configMapRef:
                name: speakasap-frontend-config
          startupProbe:
            httpGet:
              path: /
              port: 4211
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 4211
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 4211
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: speakasap-frontend
  namespace: statex-apps
  labels:
    app: speakasap-frontend
    managed-by: k8s-migration
spec:
  type: ClusterIP
  selector:
    app: speakasap-frontend
  ports:
    - protocol: TCP
      port: 4211
      targetPort: 4211
      name: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: speakasap-frontend-config
  namespace: statex-apps
  labels:
    app: speakasap-frontend
    managed-by: k8s-migration
data:
  NODE_ENV: "production"
  SERVICE_NAME: "frontend"
  PORT: "4211"
  NEXT_PUBLIC_API_URL: "https://speakasap.alfares.cz"
