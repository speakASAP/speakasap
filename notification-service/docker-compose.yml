# Local / single-container run from this directory.
# Production blue/green: use speakasap/docker-compose.blue.yml or .green.yml at repo root.
services:
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: speakasap-notification-local
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-4209}:${NOTIFICATION_SERVICE_PORT:-4209}"
    env_file:
      - ../.env
    environment:
      PORT: ${NOTIFICATION_SERVICE_PORT:-4209}
      DATABASE_URL: ${NOTIFICATION_DATABASE_URL}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://127.0.0.1:$${PORT}/health || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 2
    restart: unless-stopped
